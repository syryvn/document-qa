<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title> JS Таблиці, Таби та Форма </title>
        <style>
            h1, p { text-align: center; font-family: Arial, sans-serif; }

            /*  Кнопка відкриття форми додавання даних */

            .open-form-btn {
                display: block;
                margin: 20px auto;
                padding: 12px 28px;
                background-color: #28a745;
                color: #fff;
                border: none;
                border-radius: 4px;
                font-size: 16px;
                font-family: Arial, sans-serif;
                cursor: pointer;
                transition: background-color 0.2s;
            }
            .open-form-btn:hover { background-color: #218838; }

            .modal-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.5);
                z-index: 1000;
                justify-content: center;
                align-items: center;
                padding: 20px;
                overflow-y: auto;
            }
            .modal-overlay.show { display: flex; }

            /* Стилі для форми додавання викладачів */

            .form-container {
                position: relative;
                width: 100%;
                max-width: 600px;
                padding: 20px;
                border: 1px solid #ccc;
                border-radius: 8px;
                background-color: #f9f9f9;
                font-family: Arial, sans-serif;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
                max-height: 90vh;
                overflow-y: auto;
                animation: modalFadeIn 0.2s ease-out;
            }
            @keyframes modalFadeIn {
                from { opacity: 0; transform: translateY(-20px); }
                to   { opacity: 1; transform: translateY(0); }
            }

            /* Кнопка-хрестик закриття форми */

            .close-btn {
                position: absolute;
                top: 6px;
                right: 12px;
                background: none;
                border: none;
                font-size: 28px;
                line-height: 1;
                color: #888;
                cursor: pointer;
                transition: color 0.2s;
            }
            .close-btn:hover { color: #000; }

            .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
            .form-group label { margin-bottom: 5px; font-weight: bold; }
            .form-group input, .form-group select {
                padding: 8px;
                border: 1px solid #ccc;
                border-radius: 4px;
                font-size: 14px;
            }
            .submit-btn {
                padding: 10px 15px;
                background-color: #28a745;
                color: white;
                border: none;
                border-radius: 4px;
                font-size: 16px;
                cursor: pointer;
                width: 100%;
                transition: background-color 0.2s;
            }
            .submit-btn:hover { background-color: #218838; }

            .tabs-nav {
                display: flex;
                justify-content: center;
                gap: 10px;
                margin: 30px 0 20px 0;
            }
            .tab-btn {
                padding: 10px 20px;
                cursor: pointer;
                border: 1px solid #ccc;
                background-color: #f1f1f1;
                font-size: 16px;
                border-radius: 4px;
                font-family: Arial, sans-serif;
                transition: background-color 0.3s, color 0.3s;
            }
            .tab-btn.active {
                background-color: #007bff;
                color: white;
                border-color: #007bff;
            }

            .tab-content { display: none; }
            .tab-content.active { display: block; }

             /* Таблиця */

            table {
                margin: 20px auto;
                border-collapse: collapse;
                font-family: Arial, sans-serif;
                min-width: 750px;
                box-shadow: 0 0 10px rgba(0,0,0,0.1);
            }
            th, td {
                border: 1px solid #ddd;
                padding: 10px 15px;
                text-align: center;
                vertical-align: middle;
            }
            th { background-color: #f4f4f4; font-weight: bold; }
            tr:nth-child(even) { background-color: #f9f9f9; }

            /* Редаговані комірки */

            td[contenteditable="true"] {
                cursor: text;
                background: #fff;
                transition: background 0.15s, outline 0.15s;
            }
            td[contenteditable="true"]:hover {
                background: #fffbe6;
                outline: 1px dashed #ccc;
            }
            td[contenteditable="true"]:focus {
                outline: 2px solid #007bff;
                background: #eaf4ff;
            }

            td select {
                padding: 6px 8px;
                border: 1px solid #ccc;
                border-radius: 4px;
                font-size: 14px;
                font-family: Arial, sans-serif;
                background: #fff;
                cursor: pointer;
                transition: outline 0.15s, background 0.15s;
            }
            td select:hover { background: #fffbe6; }
            td select:focus { outline: 2px solid #007bff; }

            /* Кнопка видалення рядка */

            .delete-btn {
                background: #dc3545;
                color: #fff;
                border: none;
                border-radius: 50%;
                width: 26px;
                height: 26px;
                font-size: 16px;
                line-height: 1;
                cursor: pointer;
                transition: background 0.2s, transform 0.1s;
            }
            .delete-btn:hover { background: #c82333; }
            .delete-btn:active { transform: scale(0.9); }
         </style>
    </head>

    <body>

        <h1>JS. Створення таблиць, додавання, редагування, видалення <br>
        і збереження даних. Синхронізація вкладок браузера </h1>

        <button type="button" class="open-form-btn" id="open-form-btn">+ Додати викладача</button>

        <div class="modal-overlay" id="modal-overlay">
            <div class="form-container" role="dialog" aria-modal="true" aria-labelledby="form-title">
                <button type="button" class="close-btn" id="close-form-btn" title="Закрити">&times;</button>
                <h2 id="form-title">Додати викладача</h2>
                <form id="teacher-form">
                    <div class="form-group">
                        <label for="pib">ПІБ:</label>
                        <input type="text" id="pib" required placeholder="Наприклад: Сидоренко А.П.">
                    </div>
                    <div class="form-group">
                        <label for="degree">Вчена ступінь:</label>
                        <input type="text" id="degree" placeholder="Наприклад: к.т.н. або –">
                    </div>
                    <div class="form-group">
                        <label for="position">Посада:</label>
                        <select id="position" required>
                            <option value="Професор">Професор</option>
                            <option value="Доцент">Доцент</option>
                            <option value="Старший викладач">Старший викладач</option>
                            <option value="Асистент">Асистент</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="experience">Стаж роботи (років):</label>
                        <input type="number" id="experience" required min="0" placeholder="Наприклад: 5">
                    </div>
                    <div class="form-group">
                        <label for="rate">Ставка:</label>
                        <input type="number" id="rate" required min="0.1" max="2" step="0.05" placeholder="Наприклад: 1">
                    </div>
                    <div class="form-group">
                        <label for="department">Кафедра:</label>
                        <select id="department">
                            <option value="1">Кафедра 1</option>
                            <option value="2">Кафедра 2</option>
                        </select>
                    </div>
                    <button type="submit" class="submit-btn">Додати до таблиці</button>
                </form>
            </div>
        </div>

        <div class="tabs-nav">
            <button class="tab-btn active" data-tab="tab-1">Кафедра 1</button>
            <button class="tab-btn" data-tab="tab-2">Кафедра 2</button>
        </div>

        <div id="tab-1" class="tab-content active">
            <div id="table-container_1"></div>
        </div>
        <div id="tab-2" class="tab-content">
            <div id="table-container_2"></div>
        </div>

        <script>

            // 1. МАСИВИ ДАНИХ (кожен запис має унікальний id)

            const STORAGE_KEY_1 = 'teachersData1';
            const STORAGE_KEY_2 = 'teachersData2';
            const POSITIONS = ["Професор", "Доцент", "Старший викладач", "Асистент"];

            let teachersData1 = [];
            let teachersData2 = [];
            let nextId = 1;

            const DEFAULT_DATA_1 = [
                { id: 1, pib: "Іванов І.І.",     degree: "д.т.н.",    position: "Професор", experience: "30", rate: "1"   },
                { id: 2, pib: "Петров П.П.",     degree: "к.т.н.",    position: "Доцент",   experience: "20", rate: "1"   }
            ];
            const DEFAULT_DATA_2 = [
                { id: 3, pib: "Марченко О.А.",  degree: "д.ф.-м.н.", position: "Професор", experience: "25", rate: "1"   },
                { id: 4, pib: "Коваленко О.О.", degree: "к.ф.-м.н.", position: "Доцент",   experience: "12", rate: "0.5" }
            ];

            // Збереження — об'єкти БЕЗ циклічних посилань
            const saveData = () => {
                try {
                    localStorage.setItem(STORAGE_KEY_1, JSON.stringify(teachersData1));
                    localStorage.setItem(STORAGE_KEY_2, JSON.stringify(teachersData2));
                } catch (err) {
                    console.error('Помилка збереження в localStorage:', err);
                }
            };

            const loadData = () => {
                try {
                    const raw1 = localStorage.getItem(STORAGE_KEY_1);
                    const raw2 = localStorage.getItem(STORAGE_KEY_2);

                    teachersData1 = raw1 ? JSON.parse(raw1) : JSON.parse(JSON.stringify(DEFAULT_DATA_1));
                    teachersData2 = raw2 ? JSON.parse(raw2) : JSON.parse(JSON.stringify(DEFAULT_DATA_2));

                    if (!raw1 || !raw2) saveData();

                    const allIds = [...teachersData1, ...teachersData2].map(t => t.id || 0);
                    nextId = (allIds.length ? Math.max(...allIds) : 0) + 1;
                } catch (err) {
                    console.error('Помилка читання з localStorage:', err);
                    teachersData1 = JSON.parse(JSON.stringify(DEFAULT_DATA_1));
                    teachersData2 = JSON.parse(JSON.stringify(DEFAULT_DATA_2));
                    nextId = 5;
                }
            };

            // createRow — приймає dataArray явно (без __array на об'єкті)
            
            const createRow = (teacher, dataArray, isHeader = false) => {
                const row = document.createElement('tr');

                if (isHeader) {
                    ["ПІБ", "Вчена ступінь", "Посада", "Стаж роботи", "Ставка", "Дії"]
                        .forEach(text => {
                            const th = document.createElement('th');
                            th.textContent = text;
                            row.appendChild(th);
                        });
                    return row;
                }

                const fields = ['pib', 'degree', 'position', 'experience', 'rate'];

                fields.forEach(field => {
                    const td = document.createElement('td');

                    if (field === 'position') {
                        const select = document.createElement('select');
                        const options = POSITIONS.includes(teacher.position)
                            ? POSITIONS
                            : [teacher.position, ...POSITIONS];

                        options.forEach(opt => {
                            const o = document.createElement('option');
                            o.value = opt;
                            o.textContent = opt;
                            if (opt === teacher.position) o.selected = true;
                            select.appendChild(o);
                        });

                        select.addEventListener('change', () => {
                            teacher.position = select.value;
                            saveData();
                        });

                        td.appendChild(select);
                    } else {
                        td.textContent = teacher[field];
                        td.contentEditable = 'true';
                        td.dataset.field = field;

                        td.addEventListener('blur', () => {
                            let value = td.textContent.trim();

                            if (field === 'pib') {
                                if (!value) {
                                    alert('Поле "ПІБ" не може бути порожнім');
                                    td.textContent = teacher[field];
                                    return;
                                }
                            }
                            if (field === 'degree') {
                                value = value || '-';
                            }
                            if (field === 'experience') {
                                const num = parseFloat(value);
                                if (!Number.isFinite(num) || num < 0) {
                                    alert('Стаж має бути числом ≥ 0');
                                    td.textContent = teacher[field];
                                    return;
                                }
                                value = String(num);
                            }
                            if (field === 'rate') {
                                const num = parseFloat(value);
                                if (!Number.isFinite(num) || num < 0.1 || num > 2) {
                                    alert('Ставка має бути від 0.1 до 2');
                                    td.textContent = teacher[field];
                                    return;
                                }
                                value = String(num);
                            }

                            if (teacher[field] !== value) {
                                teacher[field] = value;
                                td.textContent = value;
                                saveData();
                            } else {
                                td.textContent = value;
                            }
                        });

                        td.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter') {
                                e.preventDefault();
                                td.blur();
                            }
                            if (e.key === 'Escape') {
                                td.textContent = teacher[field];
                                td.blur();
                            }
                        });
                    }

                    row.appendChild(td);
                });

                // Кнопка видалення — використовує переданий dataArray

                const actionsTd = document.createElement('td');
                const delBtn = document.createElement('button');
                delBtn.type = 'button';
                delBtn.className = 'delete-btn';
                delBtn.textContent = '×';
                delBtn.title = 'Видалити рядок';
                delBtn.addEventListener('click', () => {
                    if (confirm(`Видалити "${teacher.pib}"?`)) {
                        const idx = dataArray.findIndex(t => t.id === teacher.id);
                        if (idx !== -1) {
                            dataArray.splice(idx, 1);
                            saveData();
                            refreshTables();
                        }
                    }
                });
                actionsTd.appendChild(delBtn);
                row.appendChild(actionsTd);

                return row;
            };

            const buildTable = (dataArray, containerId) => {
                const container = document.getElementById(containerId);
                container.innerHTML = '';

                const table = document.createElement('table');
                table.appendChild(createRow(null, dataArray, true));

                dataArray.forEach(teacher => table.appendChild(createRow(teacher, dataArray)));

                container.appendChild(table);
            };

            const refreshTables = () => {
                buildTable(teachersData1, 'table-container_1');
                buildTable(teachersData2, 'table-container_2');
            };

            loadData();
            refreshTables();

            // Синхронізація між вкладками

            window.addEventListener('storage', (event) => {
                if (event.key === null ||
                    event.key === STORAGE_KEY_1 ||
                    event.key === STORAGE_KEY_2) {
                    loadData();
                    refreshTables();
                }
            });

            // Модальне вікно

            const overlay  = document.getElementById('modal-overlay');
            const openBtn  = document.getElementById('open-form-btn');
            const closeBtn = document.getElementById('close-form-btn');

            const openModal = () => {
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
                document.getElementById('pib').focus();
            };
            const closeModal = () => {
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            };

            openBtn.addEventListener('click', openModal);
            closeBtn.addEventListener('click', closeModal);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && overlay.classList.contains('show')) closeModal();
            });

            // Форма — додавання

            const form = document.getElementById('teacher-form');

            form.addEventListener('submit', (event) => {
                event.preventDefault();

                const newTeacher = {
                    id: nextId++,
                    pib: document.getElementById('pib').value.trim(),
                    degree: document.getElementById('degree').value.trim() || "-",
                    position: document.getElementById('position').value,
                    experience: document.getElementById('experience').value,
                    rate: document.getElementById('rate').value
                };

                const selectedDept = document.getElementById('department').value;
                if (selectedDept === "1") teachersData1.push(newTeacher);
                else if (selectedDept === "2") teachersData2.push(newTeacher);

                saveData();
                refreshTables();
                form.reset();
                closeModal();
            });

            // Таби

            const buttons  = document.querySelectorAll('.tab-btn');
            const contents = document.querySelectorAll('.tab-content');

            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    buttons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    contents.forEach(c => c.classList.remove('active'));
                    document.getElementById(button.dataset.tab).classList.add('active');
                });
            });
        </script>
    </body>
</html>
