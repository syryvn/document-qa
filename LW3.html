<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title> JS Таблиці, Таби та Форма </title>
        <style>
            h1, p { text-align: center; font-family: Arial, sans-serif; }

            /*  Кнопка відкриття форми додавання даних */

            .open-form-btn {
                display: block;
                margin: 20px auto;
                padding: 12px 28px;
                background-color: #28a745;
                color: #fff;
                border: none;
                border-radius: 4px;
                font-size: 16px;
                font-family: Arial, sans-serif;
                cursor: pointer;
                transition: background-color 0.2s;
            }
            .open-form-btn:hover { background-color: #218838; }

            /* Модальне вікно форми додавання даних */
            .modal-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.5);
                z-index: 1000;
                justify-content: center;
                align-items: center;
                padding: 20px;
                overflow-y: auto;
            }
            .modal-overlay.show { display: flex; }

            /* Стилі для форми додавання викладачів */

            .form-container {
                position: relative;
                width: 100%;
                max-width: 600px;
                padding: 20px;
                border: 1px solid #ccc;
                border-radius: 8px;
                background-color: #f9f9f9;
                font-family: Arial, sans-serif;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
                max-height: 90vh;
                overflow-y: auto;
                animation: modalFadeIn 0.2s ease-out;
            }
            @keyframes modalFadeIn {
                from { opacity: 0; transform: translateY(-20px); }
                to   { opacity: 1; transform: translateY(0); }
            }

            /* Кнопка-хрестик закриття форми */

            .close-btn {
                position: absolute;
                top: 6px;
                right: 12px;
                background: none;
                border: none;
                font-size: 28px;
                line-height: 1;
                color: #888;
                cursor: pointer;
                transition: color 0.2s;
            }
            .close-btn:hover { color: #000; }

            .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
            .form-group label { margin-bottom: 5px; font-weight: bold; }
            .form-group input, .form-group select {
                padding: 8px;
                border: 1px solid #ccc;
                border-radius: 4px;
                font-size: 14px;
            }
            .submit-btn {
                padding: 10px 15px;
                background-color: #28a745;
                color: white;
                border: none;
                border-radius: 4px;
                font-size: 16px;
                cursor: pointer;
                width: 100%;
                transition: background-color 0.2s;
            }
            .submit-btn:hover { background-color: #218838; }

            /*  Навігація табів */
            .tabs-nav {
                display: flex;
                justify-content: center;
                gap: 10px;
                margin: 30px 0 20px 0;
            }
            .tab-btn {
                padding: 10px 20px;
                cursor: pointer;
                border: 1px solid #ccc;
                background-color: #f1f1f1;
                font-size: 16px;
                border-radius: 4px;
                font-family: Arial, sans-serif;
                transition: background-color 0.3s, color 0.3s;
            }
            .tab-btn.active {
                background-color: #007bff;
                color: white;
                border-color: #007bff;
            }

            .tab-content { display: none; }
            .tab-content.active { display: block; }

            /* Таблиця */

            table {
                margin: 20px auto;
                border-collapse: collapse;
                font-family: Arial, sans-serif;
                min-width: 700px;
                box-shadow: 0 0 10px rgba(0,0,0,0.1);
            }
            th, td {
                border: 1px solid #ddd;
                padding: 12px 15px;
                text-align: center;
            }
            th { background-color: #f4f4f4; font-weight: bold; }
            tr:nth-child(even) { background-color: #f9f9f9; }

            /* Редаговані комірки */

            td[contenteditable="true"] {
                cursor: text;
                background: #fff;
                transition: background 0.15s, outline 0.15s;
            }
            td[contenteditable="true"]:hover {
                background: #fffbe6;
                outline: 1px dashed #ccc;
            }
            td[contenteditable="true"]:focus {
                outline: 2px solid #007bff;
                background: #eaf4ff;
            }

            /* Кнопка видалення рядка */

            .delete-btn {
                background: #dc3545;
                color: #fff;
                border: none;
                border-radius: 50%;
                width: 26px;
                height: 26px;
                font-size: 16px;
                line-height: 1;
                cursor: pointer;
                transition: background 0.2s, transform 0.1s;
            }
            .delete-btn:hover { background: #c82333; }
            .delete-btn:active { transform: scale(0.9); }
         </style>
    </head>

    <body>

        <h1>JS. Створення таблиць, додавання, редагування і видалення даних. </h1>

        <button type="button" class="open-form-btn" id="open-form-btn">+ Додати викладача</button>

        <div class="modal-overlay" id="modal-overlay">
            <div class="form-container" role="dialog" aria-modal="true" aria-labelledby="form-title">
                <button type="button" class="close-btn" id="close-form-btn" title="Закрити">&times;</button>
                <h2 id="form-title">Додати викладача</h2>
                <form id="teacher-form">
                    <div class="form-group">
                        <label for="pib">ПІБ:</label>
                        <input type="text" id="pib" required placeholder="Наприклад: Сидоренко А.П.">
                    </div>
                    <div class="form-group">
                        <label for="degree">Вчена ступінь:</label>
                        <input type="text" id="degree" placeholder="Наприклад: к.т.н. або –">
                    </div>
                    <div class="form-group">
                        <label for="position">Посада:</label>
                        <input type="text" id="position" required placeholder="Наприклад: Доцент">
                    </div>
                    <div class="form-group">
                        <label for="experience">Стаж роботи (років):</label>
                        <input type="number" id="experience" required min="0" placeholder="Наприклад: 5">
                    </div>
                    <div class="form-group">
                        <label for="rate">Ставка:</label>
                        <input type="number" id="rate" required min="0.1" max="2" step="0.05" placeholder="Наприклад: 1">
                    </div>
                    <div class="form-group">
                        <label for="department">Кафедра:</label>
                        <select id="department">
                            <option value="1">Кафедра 1</option>
                            <option value="2">Кафедра 2</option>
                        </select>
                    </div>
                    <button type="submit" class="submit-btn">Додати до таблиці</button>
                </form>
            </div>
        </div>

        <div class="tabs-nav">
            <button class="tab-btn active" data-tab="tab-1">Кафедра 1</button>
            <button class="tab-btn" data-tab="tab-2">Кафедра 2</button>
        </div>

        <div id="tab-1" class="tab-content active">
            <div id="table-container_1"></div>
        </div>
        <div id="tab-2" class="tab-content">
            <div id="table-container_2"></div>
        </div>

        <script>

            // 1. МАСИВИ ДАНИХ (кожен запис має унікальний id)

            let nextId = 100;

            const teachersData1 = [
                { id: 1, pib: "Іванов І.І.",      degree: "д.т.н.",    position: "Професор",     experience: "30", rate: "1"   },
                { id: 2, pib: "Петров П.П.",      degree: "к.т.н.",    position: "Доцент",       experience: "20", rate: "1"   }
            ];

            const teachersData2 = [
                { id: 3, pib: "Марченко О.А.",   degree: "д.ф.-м.н.", position: "Зав. кафедри", experience: "25", rate: "1"   },
                { id: 4, pib: "Коваленко О.О.",  degree: "к.ф.-м.н.", position: "Доцент",       experience: "12", rate: "0.5" }
            ];

            // 2. ФУНКЦІЯ СТВОРЕННЯ РЯДКА (з редагуванням і видаленням)

            const createRow = (teacher, isHeader = false) => {
                const row = document.createElement('tr');

                // РЯДОК-ЗАГОЛОВОК
                if (isHeader) {
                    ["ПІБ", "Вчена ступінь", "Посада", "Стаж роботи", "Ставка", "Дії"]
                        .forEach(text => {
                            const th = document.createElement('th');
                            th.textContent = text;
                            row.appendChild(th);
                        });
                    return row;
                }

                // РЯДОК З ДАНИМИ
                const fields = ['pib', 'degree', 'position', 'experience', 'rate'];

                fields.forEach(field => {
                    const td = document.createElement('td');
                    td.textContent = teacher[field];
                    td.contentEditable = 'true';
                    td.dataset.field = field;

                    // Збереження при втраті фокусу (blur)
                    td.addEventListener('blur', () => {
                        let value = td.textContent.trim();

                        // ВАЛІДАЦІЯ
                        if (field === 'pib' || field === 'position') {
                            if (!value) {
                                alert('Поле не може бути порожнім');
                                td.textContent = teacher[field];
                                return;
                            }
                        }
                        if (field === 'degree') {
                            value = value || '-';
                        }
                        if (field === 'experience') {
                            const num = parseFloat(value);
                            if (!Number.isFinite(num) || num < 0) {
                                alert('Стаж має бути числом ≥ 0');
                                td.textContent = teacher[field];
                                return;
                            }
                            value = String(num);
                        }
                        if (field === 'rate') {
                            const num = parseFloat(value);
                            if (!Number.isFinite(num) || num < 0.1 || num > 2) {
                                alert('Ставка має бути від 0.1 до 2');
                                td.textContent = teacher[field];
                                return;
                            }
                            value = String(num);
                        }

                        // Зберігаємо в об'єкт і фіксуємо відформатований текст у комірці
                        teacher[field] = value;
                        td.textContent = value;
                    });

                    // Enter — зберегти; Escape — скасувати
                    td.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            td.blur();
                        }
                        if (e.key === 'Escape') {
                            td.textContent = teacher[field];
                            td.blur();
                        }
                    });

                    row.appendChild(td);
                });

                // КОЛОНКА «Дії» З КНОПКОЮ ВИДАЛЕННЯ
                
                const actionsTd = document.createElement('td');
                const delBtn = document.createElement('button');
                delBtn.type = 'button';
                delBtn.className = 'delete-btn';
                delBtn.textContent = '×';
                delBtn.title = 'Видалити рядок';
                delBtn.addEventListener('click', () => {
                    if (confirm(`Видалити "${teacher.pib}"?`)) {
                        const idx = teacher.__array.findIndex(t => t.id === teacher.id);
                        if (idx !== -1) {
                            teacher.__array.splice(idx, 1);
                            refreshTables();
                        }
                    }
                });
                actionsTd.appendChild(delBtn);
                row.appendChild(actionsTd);

                return row;
            };

            // 3. ФУНКЦІЯ ЗБИРАННЯ ТАБЛИЦІ
            const buildTable = (dataArray, containerId) => {
                const container = document.getElementById(containerId);
                container.innerHTML = '';

                const table = document.createElement('table');
                table.appendChild(createRow(null, true));

                // «Прив'язуємо» масив до кожного об'єкта, щоб кнопка видалення
                // знала, з якого масиву видаляти
                dataArray.forEach(t => { t.__array = dataArray; });
                dataArray.forEach(teacher => table.appendChild(createRow(teacher)));

                container.appendChild(table);
            };

            const refreshTables = () => {
                buildTable(teachersData1, 'table-container_1');
                buildTable(teachersData2, 'table-container_2');
            };
            refreshTables();

            // 4. МОДАЛЬНЕ ВІКНО
            const overlay  = document.getElementById('modal-overlay');
            const openBtn  = document.getElementById('open-form-btn');
            const closeBtn = document.getElementById('close-form-btn');

            const openModal = () => {
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
                document.getElementById('pib').focus();
            };
            const closeModal = () => {
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            };

            openBtn.addEventListener('click', openModal);
            closeBtn.addEventListener('click', closeModal);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && overlay.classList.contains('show')) closeModal();
            });

            // 5. ОБРОБКА ФОРМИ
            const form = document.getElementById('teacher-form');

            form.addEventListener('submit', (event) => {
                event.preventDefault();

                const newTeacher = {
                    id: nextId++,
                    pib: document.getElementById('pib').value,
                    degree: document.getElementById('degree').value || "-",
                    position: document.getElementById('position').value,
                    experience: document.getElementById('experience').value,
                    rate: document.getElementById('rate').value
                };

                const selectedDept = document.getElementById('department').value;
                if (selectedDept === "1") teachersData1.push(newTeacher);
                else if (selectedDept === "2") teachersData2.push(newTeacher);

                refreshTables();
                form.reset();
                closeModal();
            });

            // 6. ПЕРЕМИКАННЯ ТАБІВ
            const buttons  = document.querySelectorAll('.tab-btn');
            const contents = document.querySelectorAll('.tab-content');

            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    buttons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    contents.forEach(c => c.classList.remove('active'));
                    document.getElementById(button.dataset.tab).classList.add('active');
                });
            });
        </script>
    </body>
</html>
